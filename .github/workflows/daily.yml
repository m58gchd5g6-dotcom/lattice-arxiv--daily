name: Daily lattice arXiv

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

concurrency:
  group: daily-lattice-arxiv
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-daily-arxiv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Fetch arXiv papers
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python daily_arxiv.py

      - name: Sync Lattice Daily paper database
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python pipeline/sync_paper_database.py

      - name: Validate paper database
        run: |
          python pipeline/validate_database.py

      - name: Test and build Lattice Daily app
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build
        
      - name: Commit generated report and database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily lattice arXiv update"
            git push
          fi
